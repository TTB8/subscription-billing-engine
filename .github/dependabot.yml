version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['@nestjs/*', 'prisma', '@prisma/*']
    ignore:
      # 12.x is ESM-only and does not load in this CommonJS app (see apps/api/package.json).
      - dependency-name: '@nestjs/schedule'
        update-types: ['version-update:semver-major']
      # Prisma 7 changes client setup (driver adapters, config file); migrate deliberately.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
