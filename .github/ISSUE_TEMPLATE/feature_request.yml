name: Feature request
description: Suggest a change to what the engine does
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What billing situation is not handled, and what goes wrong without it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Please check docs/decisions first; some behaviours (no proration, fixed-day cycles) are deliberate.
    validations:
      required: true
