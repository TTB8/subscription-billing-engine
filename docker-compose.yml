services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing # local development only
      POSTGRES_DB: billing
    ports:
      # Host port 5433 so it never clashes with a Postgres already on 5432.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U billing -d billing']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
